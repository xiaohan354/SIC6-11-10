<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-face-aframe.prod.js"></script>
  </head>
  <body>
    <a-scene mindar-face embedded color-space="sRGB" renderer="colorManagement: true; physicallyCorrectLights: true"
             vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      
      <a-assets>
        <img id="https://github.com/xiaohan354/SIC6-11-10/blob/main/mask1.png?raw=true">
        <img id="https://github.com/xiaohan354/SIC6-11-10/blob/main/mask2.png?raw=true">
        <img id="https://github.com/xiaohan354/SIC6-11-10/blob/main/mask3.png?raw=true">
      </a-assets>

      <a-camera active="false" position="0 0 0"></a-camera>

      <a-entity mindar-face-target="anchorIndex: 168">
        <a-plane id="maskPlane" src="#mask1" position="0 0 0.1" scale="1.5 1.8 1" transparent="true"></a-plane>
      </a-entity>
    </a-scene>

    <script>
      let maskIndex = 0;
      const masks = ["#mask1", "#mask2", "#mask3"];
      const maskPlane = document.getElementById("maskPlane");
      const mindarScene = document.querySelector("a-scene");

      mindarScene.addEventListener("targetLost", () => {

      });

      mindarScene.addEventListener("targetFound", () => {
        maskIndex = (maskIndex + 1) % masks.length;
        maskPlane.setAttribute("src", masks[maskIndex]);
      });
    </script>
  </body>
</html>
